# Gera dist/Klick-Setup-<versão>.exe numa máquina Windows limpa e publica como artefato do run.
name: Instalador

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg (build essentials do gyan.dev)
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath $env:RUNNER_TEMP\ffmpeg
          $dir = (Get-ChildItem $env:RUNNER_TEMP\ffmpeg -Directory | Select-Object -First 1).FullName
          "FFMPEG_DIR=$dir" | Out-File $env:GITHUB_ENV -Append
          "$dir\bin" | Out-File $env:GITHUB_PATH -Append

      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build
        run: |
          python -m venv .venv-build
          ./packaging/build.ps1 -FfmpegDir $env:FFMPEG_DIR

      - uses: actions/upload-artifact@v4
        with:
          name: Klick-Setup
          path: dist/Klick-Setup-*.exe
          if-no-files-found: error

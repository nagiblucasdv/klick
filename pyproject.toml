[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "klick"
version = "0.4.1"
authors = [{ name = "Lucas Nagib" }]
description = "Ferramenta de captura de tela: seleciona uma área e escolhe salvar, copiar, OCR ou gravar."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "mss>=9.0",
    "pynput>=1.7",
    # OCR nativo do Windows (Windows.Media.Ocr)
    "winrt-runtime>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=3.0; sys_platform == 'win32'",
    # Leitura precisa (modelos do PaddleOCR no onnxruntime, offline)
    "rapidocr>=3.4",
    "onnxruntime>=1.20",
    # Som do computador na gravação (loopback do WASAPI) e o extra de SQL
    "soundcard>=0.4",
    "sqlparse>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
klick = "klick.app:main"

[tool.setuptools.packages.find]
include = ["klick*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

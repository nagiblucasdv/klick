[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "klick"
version = "0.1.0"
description = "Ferramenta de captura de tela: seleciona uma área e escolhe salvar, copiar, OCR ou gravar."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "mss>=9.0",
    "pynput>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
klick = "klick.app:main"

[tool.setuptools.packages.find]
include = ["klick*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
